<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav class="tabs" aria-label="View">
      <button type="button" data-view="search" class="active">Search</button>
      <button type="button" data-view="find">Find a game I half-remember</button>
    </nav>
    <div class="search-row" id="search-bar">
      <form id="search-form" class="search" role="search">
        <div class="autocomplete">
          <input id="q" name="q" type="search" placeholder="Search 80,000 Steam games…" autocomplete="off"
                 aria-label="Search games" aria-autocomplete="list" aria-controls="suggestions">
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="submit">Search</button>
      </form>
      <div class="modes" role="group" aria-label="Search mode">
        <button type="button" data-mode="keyword">Keyword</button>
        <button type="button" data-mode="semantic">Semantic</button>
        <button type="button" data-mode="hybrid">Hybrid</button>
      </div>
    </div>
  </header>

  <div id="search-view" class="layout">
    <aside class="filters" aria-label="Filters">
      <section>
        <h2>Genre</h2>
        <div id="genre-facets" class="facet-list"></div>
      </section>
      <section>
        <h2>Price</h2>
        <div id="price-facets" class="facet-list"></div>
        <label class="check"><input id="free-only" type="checkbox"> Free to play only</label>
      </section>
      <section>
        <h2>Review score</h2>
        <select id="min-score" aria-label="Minimum review score">
          <option value="">Any</option>
          <option value="50">50%+</option>
          <option value="70">70%+</option>
          <option value="80">80%+</option>
          <option value="90">90%+</option>
        </select>
      </section>
      <section>
        <h2>Release year</h2>
        <div class="years">
          <input id="year-from" type="number" min="1970" max="2100" placeholder="From" aria-label="Year from">
          <span>–</span>
          <input id="year-to" type="number" min="1970" max="2100" placeholder="To" aria-label="Year to">
        </div>
      </section>
      <button id="clear-filters" type="button" class="link">Clear all filters</button>
    </aside>

    <main>
      <div class="toolbar">
        <p id="summary" aria-live="polite"></p>
        <label>Sort
          <select id="sort">
            <option value="relevance">Relevance</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="rating">Review score</option>
            <option value="newest">Newest</option>
          </select>
        </label>
      </div>
      <ol id="results" class="results"></ol>
      <nav id="pagination" class="pagination" aria-label="Pages"></nav>
    </main>
  </div>

  <div id="find-view" class="find" hidden>
    <form id="find-form">
      <label for="memory" class="find-label">Describe the game you half-remember</label>
      <textarea id="memory" rows="5" minlength="10" maxlength="1000" required
        placeholder="e.g. You play a fox in a ruined city, everything is black and white, came out around 2015"></textarea>
      <div class="find-actions">
        <label class="check"><input id="use-ai" type="checkbox" checked> Use AI to read my description</label>
        <span id="memory-count" class="muted">0 / 1000</span>
        <button type="submit">Find it</button>
      </div>
    </form>
    <div id="clues" class="clues" aria-live="polite"></div>
    <p id="find-summary" class="muted" aria-live="polite"></p>
    <ol id="find-results" class="results"></ol>
  </div>

  <script src="app.js"></script>
</body>
</html>
